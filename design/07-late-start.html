<body>
<div id="dc-root"><div class="sc-host" data-sc-name="LateStart"><div data-dc-tpl="3" style="width: 1366px; height: 720px; box-sizing: border-box; background: rgb(250, 250, 250); font-family: Inter, sans-serif; color: rgb(9, 9, 11); position: relative; overflow: hidden;">
  <div data-dc-tpl="4" style="height: 52px; background: rgb(255, 255, 255); border-bottom: 1px solid rgb(228, 228, 231);"></div>
  <div data-dc-tpl="5" style="position: absolute; top: 68px; left: 16px; right: 432px; height: 180px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 228, 231); border-radius: 12px;"></div>
  <div data-dc-tpl="6" style="position: absolute; inset: 260px 432px 16px 16px; background: rgb(24, 24, 27); border-radius: 12px;"></div>
  <div data-dc-tpl="7" style="position: absolute; top: 68px; right: 16px; width: 400px; bottom: 16px; background: rgb(255, 255, 255); border: 1px solid rgb(228, 228, 231); border-radius: 12px;"></div>
  <div data-dc-tpl="8" style="position: absolute; inset: 0px; background: rgba(9, 9, 11, 0.6);"></div>

  <div data-dc-tpl="9" role="dialog" aria-labelledby="late-title" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; background: rgb(255, 255, 255); border-radius: 12px; border: 1px solid rgb(228, 228, 231); box-shadow: rgba(0, 0, 0, 0.25) 0px 20px 50px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
    <div data-dc-tpl="10">
      <h2 data-dc-tpl="11" id="late-title" style="margin: 0px; font-size: 20px; font-weight: 600;">You're starting 10 minutes late</h2>
      <p data-dc-tpl="12" style="margin: 6px 0px 0px; font-size: 14px; color: rgb(113, 113, 122); line-height: 1.5;">It's 9:55. Sunday service was planned to start at 9:45. How should the timer pick up?</p>
    </div>

    <div data-dc-tpl="13" style="display: flex; flex-direction: column; gap: 10px;">
      
        <button data-dc-tpl="15" class="opt" style="border: 2px solid rgb(24, 24, 27); padding: 13px 15px; background: rgb(250, 250, 250);">
          <span data-dc-tpl="16" style="width: 18px; height: 18px; border-radius: 50%; margin-top: 1px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border: 2px solid rgb(24, 24, 27);"><span data-dc-tpl="17" style="width: 8px; height: 8px; border-radius: 50%; background: rgb(24, 24, 27);"></span></span>
          <span data-dc-tpl="18" style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 4px;">
            <span data-dc-tpl="19" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;"><span class="sc-interp">Catch up to the clock</span>
              <span data-dc-tpl="21" style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgb(244, 244, 245); color: rgb(63, 63, 70);">Recommended</span>
            </span>
            <span data-dc-tpl="22" style="font-size: 13px; color: rgb(82, 82, 91); line-height: 1.45;"><span class="sc-interp">Starts Praise and worship with 15:00 left, where the plan should be now. Welcome is marked skipped.</span></span>
          </span>
        </button>
      
        <button data-dc-tpl="15" class="opt" style="">
          <span data-dc-tpl="16" style="width: 18px; height: 18px; border-radius: 50%; margin-top: 1px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid rgb(161, 161, 170);"><span data-dc-tpl="17" style=""></span></span>
          <span data-dc-tpl="18" style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 4px;">
            <span data-dc-tpl="19" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;"><span class="sc-interp">Start from the top</span>
              
            </span>
            <span data-dc-tpl="22" style="font-size: 13px; color: rgb(82, 82, 91); line-height: 1.45;"><span class="sc-interp">Starts Welcome with its full 5:00. Every later item moves 10 minutes later.</span></span>
          </span>
        </button>
      
        <button data-dc-tpl="15" class="opt" style="">
          <span data-dc-tpl="16" style="width: 18px; height: 18px; border-radius: 50%; margin-top: 1px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid rgb(161, 161, 170);"><span data-dc-tpl="17" style=""></span></span>
          <span data-dc-tpl="18" style="flex: 1 1 0%; display: flex; flex-direction: column; gap: 4px;">
            <span data-dc-tpl="19" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;"><span class="sc-interp">Start from a chosen item</span>
              
            </span>
            <span data-dc-tpl="22" style="font-size: 13px; color: rgb(82, 82, 91); line-height: 1.45;"><span class="sc-interp">Pick any item. It starts now with its full time.</span></span>
          </span>
        </button>
      
    </div>

    

    <div data-dc-tpl="30" style="display: flex; align-items: center; gap: 10px; padding-top: 4px;">
      <span data-dc-tpl="31" style="flex: 1 1 0%; font-size: 13px; color: rgb(113, 113, 122);">Finish time: <b data-dc-tpl="32" style="color: rgb(9, 9, 11);"><span class="sc-interp">11:10</span></b></span>
      <a data-dc-tpl="33" class="btn" href="Main.dc.html" style="text-decoration: none;">Cancel</a>
      <a data-dc-tpl="34" class="btn btn-p" href="Main.dc.html" style="text-decoration: none;">Start</a>
    </div>
  </div></div></div></div>
