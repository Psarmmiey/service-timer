appId: uk.rccgstirling.servicetimer
productName: Service Timer
copyright: Copyright (c) RCCG Stirling
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray-icon.svg
    to: tray-icon.svg
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: ServiceTimer-Setup-${version}.exe
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ServiceTimer-${version}-portable.exe
mac:
  icon: build/icon.icns
  identity: "-"
  # Ad-hoc signed until there is an Apple Developer account (MAC-3); hardened runtime needs real signing.
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
publish:
  provider: github
  owner: Psarmmiey
  repo: service-timer
