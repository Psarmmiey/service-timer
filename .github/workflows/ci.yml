name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron fetches its binary on first launch; do it here so the smoke test doesn't time out.
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
