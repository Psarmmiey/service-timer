name: Release

# Every push to main builds the installers as workflow artifacts.
# If package.json has a version that hasn't been released yet (no v<version> tag),
# the push to main also publishes a GitHub Release with the installers. Pushing a
# v* tag by hand still works too.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Is this a new version?
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already released; building artifacts only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${tag}: will publish a release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release
        if: steps.check.outputs.publish == 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --title "Service Timer ${{ steps.check.outputs.tag }}" \
            --generate-notes

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
      - name: Upload release assets
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            dist/ServiceTimer-Setup-*.exe
            dist/ServiceTimer-Setup-*.exe.blockmap
            dist/latest.yml
            dist/ServiceTimer-*-portable.exe

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Upload release assets
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
