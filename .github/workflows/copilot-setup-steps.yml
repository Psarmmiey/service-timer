name: Copilot Setup Steps

# Prepares the environment for the GitHub Copilot coding agent before each session.
# Only takes effect from the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system libraries for headless Electron and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx -y playwright@latest install-deps chromium

      - name: Install project dependencies (once package.json exists)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json yet; skipping dependency install."
          fi
